server {
    listen 80;
    server_name api.vycord.webvaha.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.vycord.webvaha.ru;

    ssl_certificate /etc/letsencrypt/live/api.vycord.webvaha.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vycord.webvaha.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # WebSocket — основной
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket — SFU
    location /sfu/ws {
        proxy_pass http://127.0.0.1:8081/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check for SFU (uptime monitoring) — proxied so it's reachable
    # over HTTPS on the same domain instead of the bare host:8081.
    location /sfu/health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
    }

    # REST API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
