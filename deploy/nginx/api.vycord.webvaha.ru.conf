server {
    listen 80;
    server_name api.vycord.webvaha.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.vycord.webvaha.ru;

    ssl_certificate /etc/letsencrypt/live/api.vycord.webvaha.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vycord.webvaha.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # VYC-82: вложения до 25 МБ. Дефолт nginx — 1 МБ, с ним файл упрётся в
    # прокси раньше, чем дойдёт до Go. 30m = 25 МБ + оверхед multipart.
    client_max_body_size 30m;

    # Ошибки, которые nginx формирует сам, минуют CORS-middleware приложения.
    # Браузер видит ответ без Access-Control-Allow-Origin и показывает его как
    # ошибку CORS, пряча настоящую причину: именно так «файл слишком большой»
    # выглядел в консоли как «blocked by CORS policy». Отдаём такие ошибки в
    # том же JSON-формате, что и приложение, чтобы клиент показал нормальный
    # перевод по коду ошибки.
    #
    # Заголовки ставятся ТОЛЬКО в этих локациях: на проксируемых ответах их
    # ставит само приложение, и второй Access-Control-Allow-Origin заставил бы
    # браузер отвергнуть ответ целиком.
    #
    # Origin продублирован из CLIENT_URL — держать синхронно.
    error_page 413 = @error_too_large;
    error_page 502 503 504 = @error_upstream;

    location @error_too_large {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' 'https://front.vycord.webvaha.ru' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Vary' 'Origin' always;
        return 413 '{"error":"file is too large","code":"attachment_too_large"}';
    }

    # 502/503/504 схлопываются в один честный ответ «API недоступен»: для
    # клиента разница между ними неразличима, а причина одна — апстрим не
    # ответил (перезапуск контейнера при деплое, падение процесса).
    location @error_upstream {
        default_type application/json;
        add_header 'Access-Control-Allow-Origin' 'https://front.vycord.webvaha.ru' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Vary' 'Origin' always;
        return 503 '{"error":"service temporarily unavailable","code":"service_unavailable"}';
    }

    # WebSocket — основной
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket — SFU
    location /sfu/ws {
        proxy_pass http://127.0.0.1:8081/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check for SFU (uptime monitoring) — proxied so it's reachable
    # over HTTPS on the same domain instead of the bare host:8081.
    location /sfu/health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
    }

    # REST API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
