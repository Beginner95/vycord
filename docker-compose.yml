services:
  postgres:
    image: postgres:16-alpine
    container_name: vycord-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vycord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vycord_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vycord}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vycord}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vycord-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: vycord_mailhog
    ports:
      - "1025:1025"   # SMTP, сюда смотрит SMTP_HOST/SMTP_PORT приложения
      - "8025:8025"   # веб-интерфейс: письма с кодами читаются глазами
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080}
        VITE_SFU_URL: ${VITE_SFU_URL:-ws://localhost:8081}
    container_name: vycord-client
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
