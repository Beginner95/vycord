services:
  postgres:
    image: postgres:16-alpine
    container_name: vycord-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mydiscrod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mydiscrod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mydiscrod}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mydiscrod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vycord-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
