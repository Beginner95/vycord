name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS helper camera/mic usage descriptions
        if: matrix.os == 'macos-latest'
        working-directory: client
        run: |
          for DIR in release/mac release/mac-arm64; do
            for HELPER in "$DIR/Vy Cord.app/Contents/Frameworks/"*Helper*.app; do
              for KEY in NSCameraUsageDescription NSMicrophoneUsageDescription; do
                plutil -extract "$KEY" raw "$HELPER/Contents/Info.plist" >/dev/null 2>&1 \
                  || { echo "::error::$KEY missing in $HELPER"; exit 1; }
              done
            done
          done

      - name: Verify macOS arm64 entitlements
        if: matrix.os == 'macos-latest'
        working-directory: client
        run: |
          APP="release/mac-arm64/Vy Cord.app"
          if [ ! -d "$APP" ]; then
            echo "::error::$APP not found — check electron-builder's mac target output path"
            exit 1
          fi
          codesign -d --entitlements - "$APP" 2>/dev/null > ents.plist
          grep -q "com.apple.security.device.camera" ents.plist || { echo "::error::camera entitlement missing from arm64 build"; exit 1; }
          grep -q "com.apple.security.device.audio-input" ents.plist || { echo "::error::audio-input entitlement missing from arm64 build"; exit 1; }
