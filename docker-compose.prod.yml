services:
  postgres:
    image: postgres:16-alpine
    container_name: vycord-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vycord-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vycord-migrate
    command: ["./migrate", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vycord-api
    env_file: .env.prod
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  sfu:
    build:
      context: ./server
      dockerfile: Dockerfile.sfu
    container_name: vycord-sfu
    env_file: .env.prod
    # host networking is required for WebRTC ICE (UDP).
    # Docker bridge NAT blocks incoming UDP from clients, so ICE connectivity
    # checks never reach the SFU. With host networking the SFU binds directly
    # to the server's network interfaces — no NAT, no port-mapping issues.
    network_mode: host
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.7-alpine
    container_name: vycord-coturn
    # Host networking for the same reason as the SFU: TURN relays UDP and
    # allocates relay ports dynamically; bridge NAT breaks candidate addresses.
    # Firewall must allow 3478/udp, 3478/tcp, 5349/tcp (TLS) and the relay
    # range 49160-49360/udp.
    network_mode: host
    command:
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49360
      - --fingerprint
      # Ephemeral credentials (TURN REST API): username="<expiry>:<user-id>",
      # password=base64(HMAC-SHA1(secret, username)). The API server issues
      # them at GET /api/v1/turn/credentials using the same TURN_SECRET.
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=vycord
      - --no-cli
      # TLS (turns:5349) for networks that block UDP and plain TCP. Certs are
      # copied into /var/lib/vycord/coturn-certs by deploy/coturn-cert-hook.sh
      # (a certbot deploy-hook installed by deploy/deploy.sh) which also
      # restarts this container on every renewal.
      - --tls-listening-port=5349
      - --cert=/certs/fullchain.pem
      - --pkey=/certs/privkey.pem
      - --no-tlsv1
      - --no-tlsv1_1
      # turns effectively always runs over TCP; DTLS stays off.
      - --no-dtls
      - --log-file=stdout
      # Abuse protection: never relay into local/private networks (the API and
      # DB listen on 127.0.0.1). If this server's own interface has a private
      # IP (cloud NAT), additionally allow it with --allowed-peer-ip=<that IP>.
      - --no-multicast-peers
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
    volumes:
      - /var/lib/vycord/coturn-certs:/certs:ro
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_WS_URL: ${VITE_WS_URL}
        VITE_SFU_URL: ${VITE_SFU_URL}
    container_name: vycord-client
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./client/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
